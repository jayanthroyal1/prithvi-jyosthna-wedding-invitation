<link href="https://fonts.googleapis.com/css2?family=Ramaraja&family=Mandali&family=Pinyon+Script&family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Potti Sreeramulu"; src: url("../assets/fonts/potti-sreeramulu.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #fff1cf;
    background:
      radial-gradient(ellipse at 70% 45%, rgba(255,190,90,.22), transparent 55%),
      radial-gradient(circle, rgba(255,215,140,.09) 2px, transparent 2.5px) 0 0 / 28px 28px,
      linear-gradient(135deg, #a8141d, #7a0b12 55%, #5a0610);
  }
  /* gold double frame with a bead chain */
  .frame { position: absolute; inset: 12px; border: 3px solid #e9c873; border-radius: 8px;
    box-shadow: inset 0 0 0 6px #7a0b12, inset 0 0 0 8px rgba(233,200,115,.75); }
  .beads { position: absolute; inset: 26px; border-radius: 4px; pointer-events: none;
    border: 3px dotted rgba(233,200,115,.55); }
  /* pasupu-kumkuma corners */
  .pk { position: absolute; width: 74px; height: 74px; z-index: 4; }
  .pk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 0 0, #f7c531 0 62%, #e3a512 63% 66%, transparent 67%); }
  .pk i { position: absolute; left: 16px; top: 16px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff4a2f, #c8102e); box-shadow: 0 0 0 2px rgba(255,240,200,.5); }
  .tl { left: 12px; top: 12px; } .tr { right: 12px; top: 12px; transform: scaleX(-1); }
  .bl { left: 12px; bottom: 12px; transform: scaleY(-1); } .br { right: 12px; bottom: 12px; transform: scale(-1); }
  .thoranam { position: absolute; left: 70px; right: 70px; top: 20px; width: calc(100% - 140px); height: 54px; z-index: 3; }

  /* left: couple in a temple arch */
  .arch {
    position: absolute; left: 70px; top: 84px; bottom: 44px; width: 390px; border-radius: 195px 195px 14px 14px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #fffaf0, #fbe8bd 60%, #efcd85);
    box-shadow: 0 0 0 3px #e9c873, 0 0 0 9px #8e0b16, 0 0 0 11px #e9c873, 0 18px 30px rgba(0,0,0,.35);
  }
  .arch::after { content: ""; position: absolute; inset: 8px; border-radius: 187px 187px 8px 8px; border: 4px dotted #ef8f1a; -webkit-mask: linear-gradient(#000 45%, transparent 70%); }
  .couple { position: absolute; left: 50%; bottom: 0; width: 86%; transform: translateX(-50%); -webkit-mask-image: linear-gradient(#000 86%, transparent); }

  /* right: Ganesha above శుభలేఖ, then the details */
  .text { position: absolute; left: 500px; right: 64px; top: 78px; bottom: 40px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .gn { width: 92px; height: 110px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(40,0,0,.45)); }
  .gn-te { font-family: "Potti Sreeramulu", serif; font-size: 17px; color: #ffd36b; margin-top: 2px; }
  .srirastu { font-family: "Potti Sreeramulu", serif; font-size: 15px; color: #f3c98d; margin-top: 2px; letter-spacing: .5px; }
  .shubha { font-family: "Ramaraja", serif; font-size: 58px; line-height: 1.05; color: #ffd36b; margin-top: 4px; text-shadow: 0 2px 0 #7a0b12, 0 0 18px rgba(255,190,80,.35); }
  .muggu { width: 260px; height: 30px; margin: 4px 0 2px; }
  .names-te { font-family: "Ramaraja", serif; font-size: 33px; line-height: 1.25; color: #fff3d6; }
  .names-te small { font-size: 18px; color: #f3c98d; margin-right: 3px; }
  .names-te b { font-weight: 400; color: #ffd36b; margin: 0 10px; font-size: 26px; }
  .names-en { font-family: "Pinyon Script", cursive; font-size: 44px; line-height: 1.1; color: #ffe6b0; }
  .muh { margin-top: 10px; padding: 8px 26px 9px; border-radius: 12px; background: rgba(255,214,120,.1);
    box-shadow: inset 0 0 0 1.5px rgba(233,200,115,.8); }
  .muh .lbl { font-family: "Ramaraja", serif; font-size: 22px; color: #ffd36b; }
  .muh .date { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 600; font-size: 27px; color: #fff3d6; line-height: 1.15; }
  .venue { font-family: "Mandali", serif; font-size: 18px; color: #f3c98d; margin-top: 8px; }
  .tap { margin-top: 10px; padding: 6px 18px; border-radius: 999px; background: #f7c531; color: #8e0b16;
    font-family: "Cinzel", serif; font-weight: 600; font-size: 12px; letter-spacing: .28em; }
</style></head>
